name: Bug report
description: Reproducible defect in Cross.DataFilter (pagination, sorting, autocomplete, validators).
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        We may close this issue without comment if required fields are empty or verification boxes are not checked honestly.

        **Never paste** license keys, passwords, or live JWT tokens. Redact or use placeholders.

        Core CQRS / `AddCQRS` defects → [Cross.CQRS issues](https://github.com/denis-peshkov/Cross.CQRS/issues).

  - type: input
    id: package-version
    attributes:
      label: Cross.DataFilter NuGet version
      description: e.g. `1.0.1` from [nuget.org](https://www.nuget.org/packages/Cross.DataFilter/)
      placeholder: "x.y.z"
    validations:
      required: true

  - type: input
    id: core-version
    attributes:
      label: Cross.CQRS (core) NuGet version
      description: Version of the sibling package used with this library
      placeholder: "x.y.z"
    validations:
      required: false

  - type: input
    id: efcore-version
    attributes:
      label: Microsoft.EntityFrameworkCore version
      description: Host / package EF Core version (library currently targets 8.0.x)
      placeholder: "8.0.x"
    validations:
      required: false

  - type: dropdown
    id: target-framework
    attributes:
      label: Target framework (TFM)
      options:
        - net8.0
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host / integration surface
      description: e.g. ASP.NET Core Minimal API, unit test only, custom MediatR host
      placeholder: "ASP.NET Core + AddCQRS + PaginatedItemsQuery"
    validations:
      required: true

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: Please verify before submitting. If you cannot check these honestly, use the **Question** template instead.
      options:
        - label: I searched [open and closed issues](https://github.com/denis-peshkov/Cross.DataFilter/issues?q=is%3Aissue) and did not find a duplicate.
          required: true
        - label: I am on the latest **Cross.DataFilter** version listed on NuGet (or the issue also reproduces on the latest).
          required: true
        - label: I can reproduce this with a **minimal** setup (not only in a large private app), or I attached the smallest repro I can share.
          required: true
        - label: I removed secrets from logs, config snippets, and stack traces in this report.
          required: true

  - type: textarea
    id: context
    attributes:
      label: What were you trying to do (and why)?
      description: Query type, sorting attributes, pagination parameters, or autocomplete surface involved.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Actual behavior, exceptions, log excerpts (redacted).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Step-by-step reproduction
      description: |
        Include the query record, MediatR send, and relevant EF / IQueryable setup if applicable.
      render: shell
      placeholder: |
        services.AddCQRS(cfg => cfg.RegisterFromAssemblies(typeof(Program).Assembly));
        // sealed record MyQuery : PaginatedItemsQuery<MyFilter, MyDto> …
        await mediator.Send(new MyQuery(page: 1, pageSize: 20, sorting: …, filter: …));
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area (if known)
      options:
        - Unknown
        - Pagination / PaginateAsync / ApplyPaging
        - Sorting / Ordering attributes
        - AutoComplete query / handler
        - Validators (page / pageSize)
        - DTOs / result shapes
        - Packaging / nuspec / multi-targeting
        - Documentation
        - Cross.CQRS dependency / MediatR host
    validations:
      required: true
